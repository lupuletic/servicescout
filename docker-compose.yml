# ServiceScout — full stack.
#
#   docker compose up -d              # mcp + dashboard (always-on)
#   docker compose run --rm crawler   # one-shot crawl
#   docker compose run --rm reconcile # final LLM reconcile pass
#
# Required mounts (from your host):
#   ~/.config/gh        → gh CLI auth for repo discovery + cloning
#   ~/.config/gcloud    → ADC for Vertex AI embeddings
#   ~/.codex            → optional, codex CLI auth (or set OPENAI_API_KEY)
#   ~/.claude           → optional, claude CLI auth (or set ANTHROPIC_API_KEY)
#
# Required env (in .env, see .env.example):
#   WORKSPACE_ROOT, GOOGLE_CLOUD_PROJECT, plus LLM provider key.

x-servicescout: &servicescout
  image: servicescout/servicescout:${SERVICESCOUT_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
    GOOGLE_APPLICATION_CREDENTIALS: /home/cg/.config/gcloud/application_default_credentials.json
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  mcp:
    <<: *servicescout
    command: >
      python mcp_server.py
      --backend auto
      --catalog /data/catalog.json
      --kuzu-db /data/catalog.kuzu
      --transport streamable-http
      --host 0.0.0.0
      --port 8765
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
    restart: unless-stopped

  dashboard:
    <<: *servicescout
    command: >
      python dashboard.py
      --catalog /data/catalog.json
      --host 0.0.0.0
      --port 8788
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
    restart: unless-stopped

  crawler:
    <<: *servicescout
    profiles: ["crawl"]
    command: >
      python crawler.py
      --root /workspace
      --provider ${LLM_PROVIDER:-codex}
      --model ${LLM_MODEL:-gpt-5.4-mini}
      --effort ${LLM_EFFORT:-high}
      --parallelism 8
      --batch-size 12
      --budget-usd ${BUDGET_USD:-100}
      --max-age-hours 24
      --discover
      --max-discovery-rounds 10
      --reconcile
      --embed
      --build-kuzu
      --stream-logs
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ./data:/data
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro

  # Continuous-crawl scheduler (Epic #9 Tier 1 #2, Issue #1). Runs 24/7
  # alongside mcp + dashboard. Default tick: every 6 hours. Each tick
  # git-fetches every repo under WORKSPACE_ROOT, detects repos whose
  # remote HEAD differs from the last extraction's SHA, and triggers
  # crawler.py on that subset with a per-tick budget cap. Run logs
  # land in data/crawl_runs/ for the dashboard's Activity page.
  scheduler:
    <<: *servicescout
    profiles: ["scheduler"]
    command: >
      python scheduler.py
      --workspace-root /workspace
      --interval-minutes ${CRAWL_INTERVAL_MINUTES:-360}
      --budget-usd ${CRAWL_TICK_BUDGET_USD:-20}
      --provider ${LLM_PROVIDER:-codex}
      --model ${LLM_MODEL:-gpt-5.4-mini}
      --effort ${LLM_EFFORT:-medium}
      --crawler-arg --reconcile
      --crawler-arg --embed
      --crawler-arg --build-kuzu
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ./data:/data
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro
    restart: unless-stopped

  reconcile:
    <<: *servicescout
    profiles: ["maintenance"]
    command: >
      python reconcile.py
      --catalog /data/catalog.json
      --llm-assist
      --llm-provider ${LLM_PROVIDER:-codex}
      --llm-model ${LLM_MODEL:-gpt-5.4-mini}
    volumes:
      - ./data:/data
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro
