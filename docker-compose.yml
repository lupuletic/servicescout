# ServiceScout — full stack.
#
#   docker compose up -d              # mcp + dashboard (always-on)
#   docker compose run --rm crawler   # one-shot crawl
#   docker compose run --rm reconcile # final LLM reconcile pass
#
#   docker compose --profile neo4j up -d neo4j   # optional Neo4j browser
#
# Required mounts (from your host):
#   ~/.config/gh        → gh CLI auth for repo discovery + cloning
#   ~/.config/gcloud    → ADC for Vertex AI embeddings
#   ~/.codex            → optional, codex CLI auth (or set OPENAI_API_KEY)
#   ~/.claude           → optional, claude CLI auth (or set ANTHROPIC_API_KEY)
#
# Required env (in .env, see .env.example):
#   WORKSPACE_ROOT, GOOGLE_CLOUD_PROJECT, plus LLM provider key.

x-servicescout: &servicescout
  image: servicescout/servicescout:${SERVICESCOUT_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
    GOOGLE_APPLICATION_CREDENTIALS: /home/cg/.config/gcloud/application_default_credentials.json
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
    NEO4J_USER: ${NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:-servicescout}
    NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

services:
  mcp:
    <<: *servicescout
    command: >
      python mcp_server.py
      --backend auto
      --catalog /data/catalog.json
      --kuzu-db /data/catalog.kuzu
      --transport streamable-http
      --host 0.0.0.0
      --port 8765
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - catalog-data:/data:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
    restart: unless-stopped

  dashboard:
    <<: *servicescout
    command: >
      python dashboard.py
      --catalog /data/catalog.json
      --host 0.0.0.0
      --port 8788
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - catalog-data:/data
    restart: unless-stopped

  crawler:
    <<: *servicescout
    profiles: ["crawl"]
    command: >
      python crawler.py
      --root /workspace
      --provider ${LLM_PROVIDER:-codex}
      --model ${LLM_MODEL:-gpt-5.4-mini}
      --effort ${LLM_EFFORT:-high}
      --parallelism 8
      --batch-size 12
      --budget-usd ${BUDGET_USD:-100}
      --max-age-hours 24
      --discover
      --max-discovery-rounds 10
      --reconcile
      --embed
      --stream-logs
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - catalog-data:/data
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro

  reconcile:
    <<: *servicescout
    profiles: ["maintenance"]
    command: >
      python reconcile.py
      --catalog /data/catalog.json
      --llm-assist
      --llm-provider ${LLM_PROVIDER:-codex}
      --llm-model ${LLM_MODEL:-gpt-5.4-mini}
    volumes:
      - catalog-data:/data
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro

  # Optional — Neo4j Browser UI for human exploration of the catalog.
  # Bring up with: docker compose --profile neo4j up -d neo4j
  # Populate via:  docker compose run --rm crawler --neo4j-import
  neo4j:
    image: neo4j:5-community
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-servicescout}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  catalog-data:
  neo4j-data:
  neo4j-logs:
