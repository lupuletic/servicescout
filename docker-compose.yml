# ServiceScout — full stack.
#
#   docker compose up -d              # mcp + dashboard (always-on)
#   docker compose --profile edge up -d
#                                      # expose dashboard + MCP through nginx
#   docker compose run --rm crawler   # one-shot crawl
#   docker compose run --rm reconcile # final LLM reconcile pass
#
# Required mounts (from your host):
#   ~/.config/gh        → gh CLI auth for repo discovery + cloning
#   ~/.config/gcloud    → ADC for Vertex AI embeddings
#   ~/.codex            → optional, codex CLI auth for local/dev runs
#   ~/.claude           → optional, claude CLI auth for local/dev runs
#
# Required env (in .env, see .env.example):
#   WORKSPACE_ROOT, GOOGLE_CLOUD_PROJECT, plus a working extractor auth path.
# Optional workspace selection:
#   SERVICESCOUT_DATA_DIR, SERVICESCOUT_WORKSPACE_CONFIG.

x-servicescout-env: &servicescout-env
  HOST_UID: ${HOST_UID:-1000}
  HOST_GID: ${HOST_GID:-1000}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
  GOOGLE_APPLICATION_CREDENTIALS: /home/cg/.config/gcloud/application_default_credentials.json
  # Extractor auth. For a headless VM, set CODEX_API_KEY (codex) and/or
  # ANTHROPIC_API_KEY (claude) in .env — the crawler then runs without any
  # mounted ~/.codex / ~/.claude login state. CODEX_API_KEY is preferred over
  # OPENAI_API_KEY for codex so billing is explicit (see .env.example).
  CODEX_API_KEY: ${CODEX_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

x-servicescout: &servicescout
  image: lupuletic/servicescout:${SERVICESCOUT_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
      PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      PIP_NO_INDEX: ${PIP_NO_INDEX:-}
      PIP_FIND_LINKS: ${PIP_FIND_LINKS:-/tmp/wheels}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
      CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-latest}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
  environment: *servicescout-env

services:
  edge:
    image: nginx:1.27-alpine
    profiles: ["edge"]
    depends_on:
      - dashboard
      - mcp
    ports:
      - "${SERVICESCOUT_HTTP_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  mcp:
    <<: *servicescout
    command: >
      python -m servicescout.mcp_server
      --backend auto
      --catalog /data/catalog.json
      --kuzu-db /data/catalog.kuzu
      --transport streamable-http
      --host 0.0.0.0
      --port 8765
    ports:
      - "${SERVICESCOUT_MCP_BIND:-127.0.0.1:8765}:8765"
    volumes:
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
    restart: unless-stopped

  dashboard:
    <<: *servicescout
    environment:
      <<: *servicescout-env
      WORKSPACE_ROOT: /workspace
      LLM_PROVIDER: ${LLM_PROVIDER:-codex}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.4-mini}
      LLM_EFFORT: ${LLM_EFFORT:-medium}
      CRAWL_TICK_BUDGET_USD: ${CRAWL_TICK_BUDGET_USD:-20}
      SERVICESCOUT_WORKSPACE_CONFIG: /app/workspace.runtime.json
    command: >
      python -m servicescout.dashboard
      --catalog /data/catalog.json
      --extraction-log /data/extraction.jsonl
      --decisions /data/triage_decisions.jsonl
      --host 0.0.0.0
      --port 8788
    ports:
      - "${SERVICESCOUT_DASHBOARD_BIND:-127.0.0.1:8788}:8788"
    volumes:
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ${SERVICESCOUT_WORKSPACE_CONFIG:-./workspace.json}:/app/workspace.runtime.json:ro
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro
    restart: unless-stopped

  crawler:
    <<: *servicescout
    profiles: ["crawl"]
    command: >
      python -m servicescout.crawler
      --root /workspace
      --workspace /app/workspace.runtime.json
      --catalog-dir /data/catalog
      --catalog-output /data/catalog.json
      --provider ${LLM_PROVIDER:-codex}
      --model ${LLM_MODEL:-gpt-5.4-mini}
      --effort ${LLM_EFFORT:-high}
      --parallelism 8
      --batch-size 12
      --budget-usd ${BUDGET_USD:-100}
      --max-age-hours 24
      --discover
      --max-discovery-rounds 10
      --reconcile
      --embed
      --build-kuzu
      --stream-logs
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${SERVICESCOUT_WORKSPACE_CONFIG:-./workspace.json}:/app/workspace.runtime.json:ro
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro

  # Continuous-crawl scheduler. Default tick: every 6 hours. Each tick
  # fetches repos, detects remote HEAD changes, and triggers the crawler
  # on changed repos with a per-tick budget cap.
  scheduler:
    <<: *servicescout
    profiles: ["scheduler"]
    command: >
      python -m servicescout.scheduler
      --workspace-root /workspace
      --catalog-dir /data/catalog
      --workspace /app/workspace.runtime.json
      --run-log-dir /data/crawl_runs
      --lock-path /data/crawl_lock
      --interval-minutes ${CRAWL_INTERVAL_MINUTES:-360}
      --budget-usd ${CRAWL_TICK_BUDGET_USD:-20}
      --provider ${LLM_PROVIDER:-codex}
      --model ${LLM_MODEL:-gpt-5.4-mini}
      --effort ${LLM_EFFORT:-medium}
      --crawler-arg=--reconcile
      --crawler-arg=--embed
      --crawler-arg=--build-kuzu
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${SERVICESCOUT_WORKSPACE_CONFIG:-./workspace.json}:/app/workspace.runtime.json:ro
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro
    restart: unless-stopped

  reconcile:
    <<: *servicescout
    profiles: ["maintenance"]
    command: >
      python -m servicescout.reconcile
      --catalog /data/catalog.json
      --llm-assist
      --llm-provider ${LLM_PROVIDER:-codex}
      --llm-model ${LLM_MODEL:-gpt-5.4-mini}
    volumes:
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro

  # Pre-crawl diagnostics: `docker compose run --rm doctor`. Verifies extractor
  # auth (CLI login or API key), GitHub access, mounts, and embeddings before a
  # crawl burns time/budget on a misconfigured run.
  doctor:
    <<: *servicescout
    profiles: ["doctor"]
    environment:
      <<: *servicescout-env
      WORKSPACE_ROOT: /workspace
      LLM_PROVIDER: ${LLM_PROVIDER:-codex}
    command: python -m servicescout.doctor
    volumes:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:/workspace
      - ${SERVICESCOUT_DATA_DIR:-./data}:/data
      - ${HOME}/.config/gh:/home/cg/.config/gh:ro
      - ${HOME}/.config/gcloud:/home/cg/.config/gcloud:ro
      - ${HOME}/.codex:/home/cg/.codex:ro
      - ${HOME}/.claude:/home/cg/.claude:ro
